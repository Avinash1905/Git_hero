<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GitQuest - Master Git by Changing the World</title>
  <meta name="description" content="A command-line puzzle adventure blending the precision of a modern IDE with tactile 2D puzzle gameplay."/>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  
  <!-- Google Fonts: Geist, JetBrains Mono, Material Symbols Outlined -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>

  <!-- Authoritative Tailwind Configuration from DESIGN.md -->
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "surface": "#081425",
            "surface-dim": "#081425",
            "surface-bright": "#2f3a4c",
            "surface-container-lowest": "#040e1f",
            "surface-container-low": "#111c2d",
            "surface-container": "#152031",
            "surface-container-high": "#1f2a3c",
            "surface-container-highest": "#2a3548",
            "on-surface": "#d8e3fb",
            "on-surface-variant": "#bbcabf",
            "inverse-surface": "#d8e3fb",
            "inverse-on-surface": "#263143",
            "outline": "#86948a",
            "outline-variant": "#3c4a42",
            "surface-tint": "#4edea3",
            "primary": "#4edea3",
            "on-primary": "#003824",
            "primary-container": "#10b981",
            "on-primary-container": "#00422b",
            "inverse-primary": "#006c49",
            "secondary": "#adc6ff",
            "on-secondary": "#002e6a",
            "secondary-container": "#0566d9",
            "on-secondary-container": "#e6ecff",
            "tertiary": "#ffb95f",
            "on-tertiary": "#472a00",
            "tertiary-container": "#e29100",
            "on-tertiary-container": "#523200",
            "error": "#ffb4ab",
            "on-error": "#690005",
            "error-container": "#93000a",
            "on-error-container": "#ffdad6",
            "primary-fixed": "#6ffbbe",
            "primary-fixed-dim": "#4edea3",
            "on-primary-fixed": "#002113",
            "on-primary-fixed-variant": "#005236",
            "secondary-fixed": "#d8e2ff",
            "secondary-fixed-dim": "#adc6ff",
            "on-secondary-fixed": "#001a42",
            "on-secondary-fixed-variant": "#004395",
            "tertiary-fixed": "#ffddb8",
            "tertiary-fixed-dim": "#ffb95f",
            "on-tertiary-fixed": "#2a1700",
            "on-tertiary-fixed-variant": "#653e00",
            "background": "#081425",
            "on-background": "#d8e3fb",
            "surface-variant": "#2a3548"
          },
          borderRadius: {
            "sm": "0.25rem",
            "DEFAULT": "0.5rem",
            "md": "0.75rem",
            "lg": "1rem",
            "xl": "1.5rem",
            "full": "9999px"
          },
          spacing: {
            "unit": "4px",
            "xs": "4px",
            "sm": "8px",
            "md": "16px",
            "lg": "24px",
            "xl": "48px",
            "hud-margin": "32px",
            "grid-gutter": "2px"
          },
          fontFamily: {
            "display-lg": ["Geist", "sans-serif"],
            "headline-md": ["Geist", "sans-serif"],
            "headline-sm": ["Geist", "sans-serif"],
            "body-md": ["Geist", "sans-serif"],
            "terminal-code": ["JetBrains Mono", "monospace"],
            "terminal-label": ["JetBrains Mono", "monospace"],
            "hud-stat": ["JetBrains Mono", "monospace"]
          },
          fontSize: {
            "terminal-label": ["12px", { "lineHeight": "1", "letterSpacing": "0.08em", "fontWeight": "700" }],
            "headline-md": ["32px", { "lineHeight": "1.2", "fontWeight": "700" }],
            "headline-sm": ["24px", { "lineHeight": "1.3", "fontWeight": "600" }],
            "terminal-code": ["16px", { "lineHeight": "1.5", "letterSpacing": "-0.01em", "fontWeight": "500" }],
            "body-md": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }],
            "hud-stat": ["18px", { "lineHeight": "1", "fontWeight": "800" }],
            "display-lg": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.04em", "fontWeight": "800" }]

        }
      }
    };

  <!-- Design System CSS -->
  <link rel="stylesheet" href="css/styles.css"/>
</head>
<body class="bg-background text-on-background min-h-screen font-body-md overflow-x-hidden selection:bg-primary/30 selection:text-primary">
  <div id="app-root" class="min-h-screen flex flex-col relative"></div>

  <!-- Main JavaScript App Entrypoint -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
